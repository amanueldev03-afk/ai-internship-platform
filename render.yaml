services:
  # ---------------------------------------------------------------------------
  # Django Gunicorn Backend (100% Free Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-internship-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-internship-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://localhost"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"

  # ---------------------------------------------------------------------------
  # React Frontend (100% Free Web Service via Nginx Docker)
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-internship-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free

databases:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (100% Free Plan)
  # ---------------------------------------------------------------------------
  - name: ai-internship-db
    databaseName: ai_internship
    user: ai_user
    plan: free
