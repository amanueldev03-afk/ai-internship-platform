services:
  # ---------------------------------------------------------------------------
  # Django Gunicorn Backend (100% Free Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-internship-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-internship-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://localhost"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ai-internship-web
          property: host

  # ---------------------------------------------------------------------------
  # React Frontend (100% Free Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-internship-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-internship-backend
          property: host

databases:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (100% Free Plan)
  # ---------------------------------------------------------------------------
  - name: ai-internship-db
    databaseName: ai_internship
    user: ai_user
    plan: free
