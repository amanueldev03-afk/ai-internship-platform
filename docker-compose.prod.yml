version: "3.9"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 15 + pgvector
  # -------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    container_name: ai_internship_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_internship}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-ai_user} -d $${POSTGRES_DB:-ai_internship}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app_network

  # -------------------------------------------------------------------------
  # Redis 7 (Broker / Cache)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_internship_prod_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app_network

  # -------------------------------------------------------------------------
  # Django Backend (Gunicorn)
  # -------------------------------------------------------------------------
  backend:
    image: ai-internship-platform_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_internship_prod_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-ai_internship}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_internship}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://*.trycloudflare.com,http://localhost,http://127.0.0.1,http://localhost:8080}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-""}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-""}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@ai-internship.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-357646631503-tlo2lmfh1psb5n2glrgu0fr9rh6l5h3o.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-sync}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /app/entrypoint.prod.sh gunicorn --config /app/gunicorn.conf.py config.wsgi:application
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\" || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks:
      - app_network

  # -------------------------------------------------------------------------
  # Celery Worker
  # -------------------------------------------------------------------------
  celery:
    image: ai-internship-platform_backend:latest
    container_name: ai_internship_prod_celery
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-ai_internship}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_internship}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-""}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-""}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@ai-internship.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-357646631503-tlo2lmfh1psb5n2glrgu0fr9rh6l5h3o.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A config worker -l info
    networks:
      - app_network

  # -------------------------------------------------------------------------
  # Celery Beat (Periodic task scheduler)
  # -------------------------------------------------------------------------
  celery-beat:
    image: ai-internship-platform_backend:latest
    container_name: ai_internship_prod_celery_beat
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-ai_internship}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_internship}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-""}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-""}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@ai-internship.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-357646631503-tlo2lmfh1psb5n2glrgu0fr9rh6l5h3o.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A config beat -l info
    networks:
      - app_network

  # -------------------------------------------------------------------------
  # React Frontend (Nginx)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_internship_prod_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - staticfiles_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  staticfiles_data:
  media_data:

networks:
  app_network:
    driver: bridge
