openapi: 3.0.3
info:
  title: AI Internship Platform API
  version: 1.0.0
  description: API for the AI Internship Recommendation Platform
paths:
  /api/accounts/admin/login/:
    post:
      operationId: accounts_admin_login_create
      description: Admin login endpoint using username/password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/accounts/change-password/:
    post:
      operationId: accounts_change_password_create
      description: Change password for the authenticated user.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/forgot-password/:
    post:
      operationId: accounts_forgot_password_create
      description: Request a password reset email.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: JWT Logout.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: Return the currently authenticated user.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/register/:
    post:
      operationId: accounts_register_create
      description: Register a new student.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRegistration'
          description: ''
  /api/accounts/resend-verification/:
    post:
      operationId: accounts_resend_verification_create
      description: Resend email verification link.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/reset-password/:
    post:
      operationId: accounts_reset_password_create
      description: Reset password using a valid reset token.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/student/login/:
    post:
      operationId: accounts_student_login_create
      description: Student login endpoint using email/password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/accounts/token/refresh/:
    post:
      operationId: accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/accounts/verify-email/:
    post:
      operationId: accounts_verify_email_create
      description: Verify a student's email address.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
            examples:
              EmailVerification:
                value:
                  uid: MQ
                  token: abc123xyz
                summary: Email Verification
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerification'
              examples:
                EmailVerification:
                  value:
                    uid: MQ
                    token: abc123xyz
                  summary: Email Verification
          description: ''
  /api/internships/:
    get:
      operationId: internships_list
      description: Retrieve a paginated list of active and verified internships with
        filtering, search, and ordering capabilities.
      summary: List internships
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: compensation_type
        schema:
          type: string
          enum:
          - paid
          - unknown
          - unpaid
        description: |-
          * `paid` - Paid
          * `unpaid` - Unpaid
          * `unknown` - Unknown
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: duration_max_weeks
        schema:
          type: integer
      - in: query
        name: duration_min_weeks
        schema:
          type: integer
      - in: query
        name: internship_type
        schema:
          type: string
          enum:
          - hybrid
          - onsite
          - remote
        description: |-
          * `remote` - Remote
          * `onsite` - On-site
          * `hybrid` - Hybrid
      - in: query
        name: maximum_compensation
        schema:
          type: number
      - in: query
        name: minimum_compensation
        schema:
          type: number
      - in: query
        name: ordering
        schema:
          type: string
        description: Order by field (e.g., created_at, -created_at)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results per page (max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Search in title, organization, description, category, country,
          city
      - in: query
        name: skill
        schema:
          type: string
      - in: query
        name: work_type
        schema:
          type: string
          enum:
          - full_time
          - part_time
        description: |-
          * `full_time` - Full-time
          * `part_time` - Part-time
      tags:
      - Internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInternshipList'
          description: ''
  /api/internships/{id}/:
    get:
      operationId: internships_retrieve
      description: Get detailed information about a specific active and verified internship
        by ID.
      summary: Retrieve internship details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
          description: ''
  /api/internships/admin/:
    get:
      operationId: internships_admin_list
      description: Retrieve a paginated list of all internships (including draft,
        expired, and unverified) with full filtering capabilities. Admin only.
      summary: 'Admin: List all internships'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: compensation_type
        schema:
          type: string
          enum:
          - paid
          - unknown
          - unpaid
        description: |-
          * `paid` - Paid
          * `unpaid` - Unpaid
          * `unknown` - Unknown
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: duration_max_weeks
        schema:
          type: integer
      - in: query
        name: duration_min_weeks
        schema:
          type: integer
      - in: query
        name: internship_type
        schema:
          type: string
          enum:
          - hybrid
          - onsite
          - remote
        description: |-
          * `remote` - Remote
          * `onsite` - On-site
          * `hybrid` - Hybrid
      - in: query
        name: maximum_compensation
        schema:
          type: number
      - in: query
        name: minimum_compensation
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: skill
        schema:
          type: string
      - in: query
        name: work_type
        schema:
          type: string
          enum:
          - full_time
          - part_time
        description: |-
          * `full_time` - Full-time
          * `part_time` - Part-time
      tags:
      - Admin Internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInternshipList'
          description: ''
    post:
      operationId: internships_admin_create
      description: Create a new internship. Admin only.
      summary: 'Admin: Create internship'
      tags:
      - Admin Internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
          description: ''
  /api/internships/admin/{id}/:
    get:
      operationId: internships_admin_retrieve
      description: Get detailed information about any internship by ID. Admin only.
      summary: 'Admin: Retrieve internship'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin Internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
          description: ''
    put:
      operationId: internships_admin_update
      description: Update an existing internship by ID. Admin only.
      summary: 'Admin: Update internship'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin Internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
          description: ''
    patch:
      operationId: internships_admin_partial_update
      description: Partially update an existing internship by ID. Admin only.
      summary: 'Admin: Partial update internship'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin Internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInternshipRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
          description: ''
    delete:
      operationId: internships_admin_destroy
      description: Delete an internship by ID. Admin only.
      summary: 'Admin: Delete internship'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin Internships
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/internships/admin/collection-logs/:
    get:
      operationId: internships_admin_collection_logs_list
      description: Admin can view internship collection history.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternshipCollectionLog'
          description: ''
  /api/internships/admin/dashboard/:
    get:
      operationId: internships_admin_dashboard_retrieve
      description: Platform-wide dashboard for administrators.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/internships/admin/internships/{id}/verify/:
    post:
      operationId: internships_admin_internships_verify_create
      description: Verify or reject an internship.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/internships/admin/skills/:
    get:
      operationId: internships_admin_skills_list
      description: Admin manages reusable skills.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
    post:
      operationId: internships_admin_skills_create
      description: Admin manages reusable skills.
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          description: ''
  /api/internships/admin/skills/{id}/:
    get:
      operationId: internships_admin_skills_retrieve
      description: Admin manages an individual skill.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          description: ''
    put:
      operationId: internships_admin_skills_update
      description: Admin manages an individual skill.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          description: ''
    patch:
      operationId: internships_admin_skills_partial_update
      description: Admin manages an individual skill.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSkillRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          description: ''
    delete:
      operationId: internships_admin_skills_destroy
      description: Admin manages an individual skill.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/internships/admin/sources/:
    get:
      operationId: internships_admin_sources_list
      description: Admin can list and create internship sources.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternshipSource'
          description: ''
    post:
      operationId: internships_admin_sources_create
      description: Admin can list and create internship sources.
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipSourceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipSource'
          description: ''
  /api/internships/admin/sources/{id}/:
    get:
      operationId: internships_admin_sources_retrieve
      description: |-
        Admin can retrieve, update, and delete
        an internship source.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipSource'
          description: ''
    put:
      operationId: internships_admin_sources_update
      description: |-
        Admin can retrieve, update, and delete
        an internship source.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipSourceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipSource'
          description: ''
    patch:
      operationId: internships_admin_sources_partial_update
      description: |-
        Admin can retrieve, update, and delete
        an internship source.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInternshipSourceRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipSource'
          description: ''
    delete:
      operationId: internships_admin_sources_destroy
      description: |-
        Admin can retrieve, update, and delete
        an internship source.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/internships/admin/sources/{id}/collect/:
    post:
      operationId: internships_admin_sources_collect_create
      description: Queue internship collection as a background task.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/internships/applications/:
    get:
      operationId: internships_applications_list
      description: |-
        Return applications belonging only to the
        authenticated student.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternshipApplication'
          description: ''
  /api/internships/applications/{id}/:
    get:
      operationId: internships_applications_retrieve
      description: |-
        Retrieve or update an application belonging
        to the authenticated student.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipApplication'
          description: ''
    put:
      operationId: internships_applications_update
      description: |-
        Retrieve or update an application belonging
        to the authenticated student.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipApplication'
          description: ''
    patch:
      operationId: internships_applications_partial_update
      description: |-
        Retrieve or update an application belonging
        to the authenticated student.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInternshipApplicationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipApplication'
          description: ''
  /api/internships/applications/add/:
    post:
      operationId: internships_applications_add_create
      description: |-
        Record that the authenticated student has
        applied for an internship.
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipApplication'
          description: ''
  /api/internships/dashboard/:
    get:
      operationId: internships_dashboard_retrieve
      description: |-
        Return internship statistics and recent
        activity for the authenticated student.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/internships/latest/:
    get:
      operationId: internships_latest_list
      description: Retrieve the latest 20 active and verified internships ordered
        by posting date.
      summary: Latest internships
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInternshipList'
          description: ''
  /api/internships/saved/:
    get:
      operationId: internships_saved_list
      description: |-
        Return internships saved by the authenticated
        student.
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedInternship'
          description: ''
  /api/internships/saved/{internship_id}/:
    delete:
      operationId: internships_saved_destroy
      description: Remove a saved internship.
      parameters:
      - in: path
        name: internship_id
        schema:
          type: integer
        required: true
      tags:
      - internships
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/internships/saved/add/:
    post:
      operationId: internships_saved_add_create
      description: Save an internship for the authenticated student.
      tags:
      - internships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedInternshipRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedInternship'
          description: ''
  /api/profile/:
    get:
      operationId: profile_retrieve
      description: Return the authenticated student's profile.
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
