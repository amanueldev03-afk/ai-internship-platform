version: "3.9"

# =============================================================================
# SmartIntern-ET — Local Development Docker Compose Environment
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension for ML embeddings
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartintern_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartintern_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-smartintern_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis 7 Alpine cache and Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smartintern_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Django ASGI Backend (Daphne: HTTP & Channels WebSockets)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartintern_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-smartintern-secret-key-dev}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/smartintern_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ETHIO_SMS_API_KEY: ${ETHIO_SMS_API_KEY:-}
      STORAGE_BACKEND: filesystem
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - ai_models_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  # ---------------------------------------------------------------------------
  # Django ASGI Backend (Daphne: WebSockets on port 8001 for Phase 16)
  # ---------------------------------------------------------------------------
  backend_asgi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartintern_backend_asgi
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-smartintern-secret-key-dev}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/smartintern_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ETHIO_SMS_API_KEY: ${ETHIO_SMS_API_KEY:-}
      STORAGE_BACKEND: filesystem
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - ai_models_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application

  # ---------------------------------------------------------------------------
  # Celery Background Worker
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartintern_celery_worker
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-smartintern-secret-key-dev}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/smartintern_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      STORAGE_BACKEND: filesystem
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - ai_models_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info -c 4

  # ---------------------------------------------------------------------------
  # Celery Beat Periodic Task Scheduler
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartintern_celery_beat
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-smartintern-secret-key-dev}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/smartintern_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ---------------------------------------------------------------------------
  # React 18 / Vite / Tailwind Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartintern_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_OAUTH_BASE_URL: http://localhost:8000
    depends_on:
      - backend

# -----------------------------------------------------------------------------
# Shared Volumes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
  redisdata:
  ai_models_cache:
  media_volume:

